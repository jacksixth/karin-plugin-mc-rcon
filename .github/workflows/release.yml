name: Build, Bump Version, and Commit

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: 安装pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.7

      - name: 安装依赖
        run: |
          pnpm install

      - name: 运行测试
        run: pnpm test

      - name: 更新版本号
        uses: google-github-actions/release-please-action@v3
        id: release_please
        with:
          release-type: node
          package-name: "karin-plugin-mc-rcon"

      - name: 删除 pnpm-lock.yaml
        run: rm -rf pnpm-lock.yaml

      - name: 编译
        run: pnpm build

      - name: 设置时区
        run: |
          sudo timedatectl set-timezone Asia/Shanghai

      - name: 设置git用户名和邮箱
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 删除开发依赖
        run: npm run pr clean

      - name: 删除文件
        run: |
          rm -rf src .github tsconfig.json eslint.config.mjs

      - name: 推送build分支
        run: |
          sed -i '19d' .gitignore
          git checkout -b build || git checkout build
          git add .
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes detected"
            exit 0
          else
            git commit -m "chore(build): ${{ github.event.head_commit.message }}"
          fi
          git push origin build --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包
        run: |
          zip -r build.zip lib package.json README.md LICENSE CHANGELOG.md config resources

      - name: 上传 build.zip
        uses: actions/upload-artifact@v4
        with:
          name: build-zip
          path: build.zip

      # npm@12 要 Node >= 22.22.2，先锁 11 大版本（trusted publishing 需要 >= 11.5.1）
      - name: 升级 npm（trusted publishing 需要 >= 11.5.1）
        run: npm install -g npm@11

      # 用 OIDC 发布，不要设置 NODE_AUTH_TOKEN，否则会覆盖 trusted publishing
      # 不判断 release_created，重跑也能补发；靠版本判重避免重复发布
      - name: 发布到 npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "karin-plugin-mc-rcon@$VERSION" version >/dev/null 2>&1; then
            echo "karin-plugin-mc-rcon@$VERSION 已发布，跳过"
          else
            npm run pub
          fi

      - name: 上传 release
        if: ${{ steps.release_please.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release_please.outputs.tag_name }} build.zip
